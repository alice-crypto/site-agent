{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Site Agent{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6f5c'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Site Agent</span>
    </a>
    {% if user.is_authenticated %}
      <nav class="topbar-actions">
        {% if user.is_staff %}<a class="button" href="{% url 'admin:index' %}">Administration</a>{% endif %}
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="button" type="submit">Se déconnecter</button></form>
      </nav>
    {% endif %}
  </header>
  <main class="auth">
    <div class="auth-card">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
