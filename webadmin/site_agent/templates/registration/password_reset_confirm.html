{% extends "base.html" %}
{% block content %}
  {% if validlink %}
    <h1>Nouveau mot de passe</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "_fields.html" %}
      <button class="button primary" type="submit">Enregistrer</button>
    </form>
  {% else %}
    <h1>Lien invalide</h1>
    <p class="muted">Ce lien a déjà servi ou a expiré. Demandez-en un nouveau.</p>
    <a class="button primary" href="{% url 'password_reset' %}">Nouveau lien</a>
  {% endif %}
{% endblock %}
