{% extends "base.html" %}
{% block title %}Mot de passe · Site Agent{% endblock %}
{% block content %}
  <h1>Changer de mot de passe</h1>
  <p class="muted">Connecté en tant que {{ user.get_username }}. Vos autres sessions seront déconnectées.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "_fields.html" %}
    <button class="button primary" type="submit">Changer</button>
  </form>
  <p class="muted"><a href="/">Retour à l'agent</a></p>
{% endblock %}
